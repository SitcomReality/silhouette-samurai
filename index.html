<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Silhouette Ballet</title>
  <link rel="stylesheet" href="./main.css">
</head>
<body>
  <div id="root">
    <div class="game-container">
      <canvas id="game-canvas"></canvas>
      <div id="ui-overlay" class="ui-overlay">
        <!-- Top Bar -->
        <div class="top-bar">
          <div class="header-card">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <svg id="header-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="animate-pulse"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
              <h1 style="margin: 0; font-size: 1.25rem; font-weight: 900; letter-spacing: 0.05em;">
                SILHOUETTE <span id="header-highlight">BALLET</span>
              </h1>
            </div>
            <p style="margin: 0.25rem 0 0 0; font-size: 0.75rem; color: #94a3b8; max-width: 20rem;">
              Single Contour Line Upper-Envelope Platformer. Ground and entities are fused using Signed Distance Fields.
            </p>
          </div>

          <div class="metrics-container pointer-events-auto">
            <div class="metric-card">
              <div class="metric-label">Score</div>
              <div id="score-val" class="metric-value text-white">0</div>
            </div>
            <div class="metric-card">
              <div class="metric-label">Max Combo</div>
              <div id="max-combo-val" class="metric-value" style="color: var(--theme-color);">0x</div>
            </div>
          </div>
        </div>

        <!-- Combo Splash -->
        <div class="combo-splash">
          <div id="combo-container" class="hidden text-center animate-bounce">
            <div id="combo-val" class="combo-text" style="color: var(--theme-color); text-shadow: 0 0 30px var(--theme-color);">
              0<span style="font-size: 2.25rem; color: white;">x</span>
            </div>
            <div class="combo-subtitle">
              BALLET OF BRUTALITY
            </div>
          </div>
        </div>

        <!-- Bottom Bar -->
        <div class="bottom-bar">
          <div class="customizer-card">
            <div class="customizer-header">SDF Contour Customizer</div>
            <div id="theme-buttons" class="theme-buttons"></div>
            <label class="dev-mode-toggle">
              <input type="checkbox" id="dev-mode-checkbox" />
              <span>Dev Mode (View Underlying Stick Skeletons)</span>
            </label>
          </div>

          <div style="pointer-events: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 0.75rem;">
            <div class="controls-hint hidden-mobile">
              <span>Move: <strong class="text-white">A / D</strong> or <strong class="text-white">Arrows</strong></span>
              <span class="divider">|</span>
              <span>Jump: <strong class="text-white">W / Space</strong></span>
              <span class="divider">|</span>
              <span>Attacks: <strong class="text-white">1, 2, 3</strong></span>
            </div>

            <div class="action-buttons">
              <button id="btn-atk-1" class="btn-action">
                <span class="btn-icon">🗡️</span>
                <span class="btn-label">1: Sweep</span>
              </button>
              <button id="btn-atk-2" class="btn-action">
                <span class="btn-icon">⚡</span>
                <span class="btn-label">2: Roundhouse</span>
              </button>
              <button id="btn-atk-3" class="btn-action btn-slam">
                <span class="btn-icon">✨</span>
                <span class="btn-label">3: Slam</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v833ccba57c9e4d2798f2e76cebdd09a11778172276447" integrity="sha512-57MDmcccJXYtNnH+ZiBwzC4jb2rvgVCEokYN+L/nLlmO8rfYT/gIpW2A569iJ/3b+0UEasghjuZH/ma3wIs/EQ==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
